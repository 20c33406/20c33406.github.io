<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">

    </head>
    <body id="body">

        <div id="parent" style="display:flex" >

            <div id="Config Control" style="margin-right:20px">
                <input id="configInput">
                <button onclick="loadConfig()">Load Config</button>
                <br>
                <button onclick="location.href = '/scenarioCreator/index.html';">Scenario Creator</button>
            </div>
            <div id="speedControls" style="margin-right:20px">
                <button onclick="decreaseTime()"><</button>
                <button onclick="increaseTime()">></button>
                <p>Game Speed: <span id="gameSpeedValue">1</span>x</p>
            </div>

            <div id="rocketControls">
                <input type="radio" name="rocketControls" value="pg" id="pg">Prograde
                <input type="radio" name="rocketControls" value="rg" id="rg">Retrograde
                <input type="radio" name="rocketControls" value="na" id="na" checked>N/A
                <br>
                <input type="radio" name="rocketControls" value="no" id="no">Normal
                <input type="radio" name="rocketControls" value="an" id="an">Anti-normal
                <br>
                <input type="radio" name="rocketControls" value="ri" id="ri">Radial-in
                <input type="radio" name="rocketControls" value="ro" id="ro">Radial-out
                <br>
                <button onclick="checkControls()">Submit</button>
            </div>
        </div>
        <div id="container" class="container">
            <canvas id="myCanvas" height="1000" width="2000"></canvas>
        </div>
        <script src="script.js"></script>
    </body>
</html>
